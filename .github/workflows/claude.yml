# Lets you talk to Claude inside this repo.
#
# Comment "@claude <what you want>" on any issue or pull request and Claude
# reads the repo, makes the change and opens a pull request. Nothing happens
# unless someone with write access types the trigger phrase, so this is idle
# and free until you use it.
#
# The pairing that makes this worth having: site/submit.html files an issue
# through .github/ISSUE_TEMPLATE/event-submission.yml when someone submits an
# event. Reply to that issue with
#
#     @claude add this event to data/manual.yml
#
# and you get a PR instead of hand-editing YAML on a phone.
#
# Other things it is good for:
#     @claude add greattrailsnc.com as a source at aggregator trust
#     @claude the Dancing Bear title is shouting, clean up promoter titles
#     @claude yesterday's build says runsignup is down, work out why
#
# Requires: the Claude GitHub App installed on this repo, and the
# ANTHROPIC_API_KEY secret (already set for the daily build — same one).
# Read CLAUDE.md first, it is the brief for whoever picks this up.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Keeps a runner from starting on every unrelated comment.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    # Don't let a long session run away — this repo's tasks are small.
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 15"
