name: Build events calendar

on:
  schedule:
    - cron: "17 9 * * *"        # 05:17 ET daily — before the shop opens
  workflow_dispatch:             # "Run workflow" button, for when you can't wait
  push:
    branches: [main]
    paths:
      - "sources.yml"
      - "data/manual.yml"
      - "*.py"
      - "site/**"
  issues:
    types: [labeled, unlabeled, edited]   # approving a submission rebuilds

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: events-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build calendar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A repo secret is NOT automatically an environment variable — it has
          # to be mapped here explicitly. These two were saved in Settings and
          # the build still reported "ridewithgps needs RWGPS_API_KEY", because
          # this block did not mention them. If you add a secret for a new
          # source, add the line here too or nothing will change.
          RWGPS_API_KEY: ${{ secrets.RWGPS_API_KEY }}
          RWGPS_AUTH_TOKEN: ${{ secrets.RWGPS_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python build.py

      - name: Commit results
        run: |
          git config user.name  "altar-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site data/cache
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "events: $(date -u +%Y-%m-%d) [skip ci]"

          # The runner may not be at the tip: a web-UI edit, or a SECOND build
          # overlapping this one, can land first. Do NOT rebase — everything we
          # write is GENERATED (site/, data/cache/), so replaying our commit
          # onto theirs conflicts on all 16 files at once. That is exactly how
          # run #17 died on 2026-08-21 after an earlier "fix" chose rebase.
          #
          # Generated output is authoritative because it was just built from
          # current data. So: move HEAD to the new tip with a MIXED reset,
          # which leaves our freshly built files on disk, then stage only our
          # own directories and commit on top. A mixed reset is deliberate —
          # --soft would keep the whole old tree staged and silently revert
          # anyone else's concurrent edit to sources.yml.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; re-basing generated output onto the new tip (attempt $attempt)."
            git fetch origin main
            git reset origin/main
            git add -A site data/cache
            if git diff --staged --quiet; then
              echo "Someone else already published identical output. Nothing to do."
              exit 0
            fi
            git commit -m "events: $(date -u +%Y-%m-%d) [skip ci]"
          done
          echo "::error::Could not push results after 3 attempts."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Flag broken sources
        run: |
          python - <<'PY'
          import json, os, pathlib
          r = json.loads(pathlib.Path("site/build-report.json").read_text())
          bad = r.get("needs_attention", [])
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [f"### {r['total']} events published\n"]
          for sid, info in r["sources"].items():
              mark = {"ok": "ok", "cached": "stale", "failed": "down"}.get(info["status"], "?")
              lines.append(f"- **{sid}** — {mark}"
                           + (f" ({info.get('kept')} events via {info.get('adapter')})"
                              if info["status"] == "ok" else
                              f" — {(info.get('errors') or ['-'])[-1][:120]}"))
          summary.write_text("\n".join(lines))
          if bad:
              print(f"::warning::Sources needing attention: {', '.join(bad)}")
          PY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
